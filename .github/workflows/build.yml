
name: Construire APK Des GO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Decompresser le projet
        run: unzip -q Tableau_Des_GO_Projet_Android.zip

      - name: Compiler APK
        working-directory: MonopolyGo_Tableau_Prediction
        run: gradle assembleDebug

      - name: Recuperer APK
        uses: actions/upload-artifact@v4
        with:
          name: Tableau-Des-GO-APK
          path: MonopolyGo_Tableau_Prediction/app/build/outputs/apk/debug/app-debug.apk
